version: '3.8'

# ==========================================
# CasaOS App Store & Dashboard Metadata
# ==========================================
x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: backend
  description:
    en_us: "Pardal PromoHub - Complete affiliate automation platform and Telegram/WhatsApp promotion bot"
    pt_br: "Pardal PromoHub - Sistema profissional de automação e gestão de canais de afiliados e bots Telegram/WhatsApp"
  tag: "Afiliados & E-commerce"
  thumbnail: "https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/telegram.png"
  title:
    en_us: "Pardal PromoHub"
    pt_br: "Pardal PromoHub"
  index: /
  port_map: "8085"
  scheme: http

services:
  postgres:
    image: postgres:16-alpine
    container_name: pardal_postgres
    restart: unless-stopped
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: pardal_promohub
      POSTGRES_USER: pardal_user
      POSTGRES_PASSWORD: SUA_SENHA_POSTGRES_AQUI
    volumes:
      - /DATA/AppData/pardalflow/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d pardal_promohub -U pardal_user || pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pardal_net
    x-casaos:
      ports:
        - container: "5432"
          description:
            en_us: "PostgreSQL Database Port"
            pt_br: "Porta do Banco de Dados PostgreSQL"

  backend:
    image: ghcr.io/arthurwallace/pardalflow:latest
    container_name: pardal_backend
    restart: unless-stopped
    ports:
      - "8085:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://pardal_user:SUA_SENHA_POSTGRES_AQUI@postgres:5432/pardal_promohub
      - PORT=8000
      - HOST=0.0.0.0
      - SECRET_KEY=SUA_CHAVE_JWT_AQUI
    volumes:
      - /DATA/AppData/pardalflow/sessions:/app/backend/sessions
      - /DATA/AppData/pardalflow/data:/app/backend/data
    networks:
      - pardal_net
    x-casaos:
      ports:
        - container: "8000"
          description:
            en_us: "Web App Interface & REST API (Host: 8085 -> Container: 8000)"
            pt_br: "Interface Web do Painel & API REST (Host: 8085 -> Container: 8000)"

networks:
  pardal_net:
    name: pardal_net
    driver: bridge
